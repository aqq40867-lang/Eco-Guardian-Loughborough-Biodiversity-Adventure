services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecoguardian
      MYSQL_USER: ecoguardian
      MYSQL_PASSWORD: ecoguardian
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ecoguardian
      DB_USER: ecoguardian
      DB_PASS: ecoguardian
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./my-react-app
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
